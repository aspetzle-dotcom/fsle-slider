  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

(() =&gt; {
  const root = document.getElementById(&#x27;lv-fsle-noise-slider&#x27;);

  const plot = root.querySelector(&#x27;#lv-fsle-plot&#x27;);

  const NS = &#x27;http://www.w3.org/2000/svg&#x27;;
  const names = {d:&#x27;Direct&#x27;,r:&#x27;Raw S-map&#x27;,h:&#x27;HMS + S-map&#x27;};
  const classes = {d:&#x27;direct&#x27;,r:&#x27;raw&#x27;,h:&#x27;hms&#x27;};
  const fmt = new Intl.NumberFormat(&#x27;en&#x27;, {maximumSignificantDigits:6});
  let level = 0;
  let currentWidth = 0;

  function element(tag, attributes, text) {
    const node = document.createElementNS(NS, tag);
    for (const [name,value] of Object.entries(attributes || {})) node.setAttribute(name,String(value));
    if (text !== undefined) node.textContent = text;
    return node;
  }
  function supported(row) { return row[0] !== null &amp;&amp; Number.isFinite(row[0]) &amp;&amp; row[0] &gt; 0 &amp;&amp; row[1] &gt;= 5; }

    const lines = [`Separation δ: ${fmt.format(data.delta[index])}`, `Observation noise: ${level}%`];
    for (const key of [&#x27;d&#x27;,&#x27;r&#x27;,&#x27;h&#x27;]) {
      const row = data.levels[level][key][index];
      const value = supported(row) ? `${fmt.format(row[0])} per time unit` : &#x27;unsupported&#x27;;
      const duration = row[2] === null ? &#x27;&#x27; : `; ${key === &#x27;d&#x27; ? &#x27;mean crossing time&#x27; : &#x27;completed time&#x27;} ${fmt.format(row[2])}`;
      lines.push(`${names[key]}: ${value}; ${row[1]} crossings${duration}`);

    return lines.join(&#x27;\n&#x27;);

    const height = Math.round((width &lt; 500 ? 330 : 380)*scale);
    const left = 63*scale, right = 16*scale, top = 12*scale, bottom = 55*scale;
    const pw = width-left-right, ph = height-top-bottom;
    const xMin = Math.log10(data.delta[0]*.88), xMax = Math.log10(data.delta[data.delta.length-1]*1.12);

    const record = data.levels[level];
    const support = Object.fromEntries([&#x27;d&#x27;,&#x27;r&#x27;,&#x27;h&#x27;].map(key=&gt;[key, record[key].filter(supported).length]));
